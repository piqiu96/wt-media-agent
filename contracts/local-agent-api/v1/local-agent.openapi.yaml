openapi: 3.0.3
info:
  title: WT Media Local Agent Loopback API
  version: 2026.09.04.1
servers:
  - url: http://127.0.0.1:8765
paths:
  /healthz:
    get:
      operationId: localAgentHealth
      responses:
        '200':
          description: Local Agent process is running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/status:
    get:
      operationId: localAgentStatus
      responses:
        '200':
          description: Current observable Agent state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentStatus'}
  /api/v1/events:
    get:
      operationId: localAgentEvents
      responses:
        '200':
          description: Server-sent status events.
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/bit-browser/profile-scans:
    post:
      operationId: scanBitBrowserProfiles
      responses:
        '200':
          description: Full secret-free Profile snapshot with one verified normalized BitBrowser main account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileSnapshot'}
        '409': {description: Profile main account is empty, missing, or mixed, or Profile userId is missing.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/bit-browser/profile-groups:
    post:
      operationId: listBitBrowserProfileGroups
      description: Synchronously reads safe BitBrowser group identifiers for profile creation.
      responses:
        '200':
          description: Safe group list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [groups]
                    properties:
                      groups:
                        type: array
                        items: {$ref: '#/components/schemas/BitProfileGroup'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/account-check:
    post:
      operationId: checkPlatformAccountInProfile
      description: Synchronously opens/reads one BitBrowser profile and returns only safe platform identity facts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCheckRequest'}
      responses:
        '200':
          description: Account check finished with a business login status. Normal requires a platform_account_id.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AccountCheckResult'}
        '400': {description: Required profile or platform input is invalid.}
        '409': {description: BitBrowser identity is not verifiable.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/proxy-check:
    post:
      operationId: checkProxyConnectivity
      description: Synchronously runs a bounded proxy connectivity check and never returns credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyCheckRequest'}
      responses:
        '200':
          description: Connectivity result without credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyCheckResult'}
        '400': {description: Proxy input is invalid.}
  /api/v1/proxy-mutation:
    post:
      operationId: mutateProfileProxy
      description: Synchronously writes one proxy to a BitBrowser Profile and returns only the read-back proxy facts after verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyMutationRequest'}
      responses:
        '200':
          description: BitBrowser accepted the update and the returned Profile proxy facts match the requested address and port.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyMutationResult'}
        '400': {description: Proxy mutation input is invalid.}
        '409': {description: The requested proxy does not match the Profile read-back.}
        '502': {description: BitBrowser Local API failed.}
components:
  schemas:
    Health:
      type: object
      required: [status, service, mode]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [wt-media-agent]}
        mode: {type: string, enum: [m1]}
    AgentStatus:
      type: object
      required: [agent_id, status, pending_result_count]
      properties:
        agent_id: {type: string}
        status: {type: string, enum: [idle, running, draining, offline]}
        current_task_id: {type: string, nullable: true}
        pending_result_count: {type: integer, minimum: 0}
    ProfileSnapshot:
      type: object
      required: [main_user_id, profiles]
      properties:
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId.}
        profiles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BitProfile'}
    BitProfile:
      type: object
      required: [bit_profile_id, main_user_id, profile_user_id, name, group_id, group_name, bit_updated_at]
      properties:
        bit_profile_id: {type: string}
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId; must match snapshot main_user_id.}
        profile_user_id: {type: string, description: Normalized from BitBrowser userId for Profile/sub-account audit.}
        name: {type: string}
        seq: {type: integer, nullable: true}
        group_id: {type: string}
        group_name: {type: string}
        status: {oneOf: [{type: integer}, {type: string}], nullable: true}
        bit_updated_at: {type: string}
      additionalProperties: false
    BitProfileGroup:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
      additionalProperties: false
    AccountCheckRequest:
      type: object
      required: [profile_id, platform]
      properties:
        profile_id: {type: string, description: BitBrowser profile id.}
        platform: {type: string, enum: [bilibili, baijiahao, douyin]}
        expected_platform_account_id: {type: string, description: Existing Cloud platform account id used to detect mismatch.}
      additionalProperties: false
    AccountCheckResult:
      type: object
      required: [platform_account_id, name, avatar_url, login_status, message]
      properties:
        platform_account_id: {type: string}
        name: {type: string}
        avatar_url: {type: string}
        login_status:
          type: string
          enum: [normal, not_logged_in, verification_needed, expired, restricted, account_mismatch, environment_error]
        message: {type: string}
      additionalProperties: false
    ProxyCheckRequest:
      type: object
      required: [host, port]
      properties:
        proxy_id: {type: string}
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, writeOnly: true}
        password: {type: string, writeOnly: true}
      additionalProperties: false
    ProxyCheckResult:
      type: object
      required: [connectivity]
      properties:
        proxy_id: {type: string}
        connectivity: {type: string, enum: [reachable, unreachable]}
      additionalProperties: false
    ProxyMutationRequest:
      type: object
      required: [profile_id, proxy_protocol, host, port]
      properties:
        profile_id: {type: string, description: BitBrowser profile id.}
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, writeOnly: true}
        password: {type: string, writeOnly: true}
      additionalProperties: false
    ProxyMutationResult:
      type: object
      required: [profile_id, proxy_protocol, host, port, readback]
      properties:
        profile_id: {type: string}
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer}
        readback: {type: boolean, enum: [true]}
      additionalProperties: false
