openapi: 3.0.3
info:
  title: WT Media Local Agent Loopback API
  # Bumped by CHG-20260923-057 T-08: /api/v1/health added, /healthz untouched.
  # Bumped by CHG-20260924-061 T-04: /api/v1/save-directory added.
  # Bumped by CHG-20261002-074: `scan` parameter added to /api/v1/status.
  # Bumped by CHG-20261023-101: Agent Token, BitBrowser bind, sensitive preflight and
  # permit finish, profile CRUD, cookie read; scan observations now carry `observed_at`.
  # Bumped by CHG-20261015-098 (round 3): platform id `baijiahao` renamed to `baidu`.
  # Bumped by CHG-20261028-099: retire generic task preflight/permit routes and proxy-check.
  version: 2026.10.29.2
  description: |
    The loopback API the Desktop drives on this machine. Every route requires the
    local runtime token (`Authorization: Bearer <runtime token>`) when one is
    configured; an unauthenticated request answers `401 {"error": "unauthorized"}`.

    Routes that act for the signed-in user (`/api/v1/agent-token`,
    `/api/v1/bit-account/bind`) additionally need the Agent
    Token that the Desktop obtained from Cloud and handed to
    `POST /api/v1/agent-token`. That token lives in memory only: this API never
    echoes it back, never writes it to disk, and answers `400 agent_token_required`
    when none has been provided. Every other route is local-only and never talks to
    Cloud.

    Errors use `{error: {code, message?, retryable?, recovery_action?}}`; codes are
    listed in `contracts/local-error-codes/`.
servers:
  - url: http://127.0.0.1:8765
paths:
  /healthz:
    get:
      operationId: localAgentHealth
      responses:
        '200':
          description: Local Agent process is running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/health:
    get:
      operationId: localAgentAggregateHealth
      description: |
        Aggregate health: Agent version and Agent status, plus the status of
        Cloud, BitBrowser and Storage (CHG-20260923-057 T-08; architecture
        baseline §5.6, ADR-0016 §10). `/healthz` is frozen and is not this.

        Two guarantees, both about what this endpoint does *not* do:

        - It sends no outbound write request for any reason -- no heartbeat, no
          task claim, nothing that changes state on the far side. Cloud is
          probed with a TCP connection to the configured host and port and
          nothing else, so `cloud.status` is *reachability*: a Cloud that
          accepts the connection and then rejects this Agent's token still
          reports `normal`.
        - It never fails because a dependency is unavailable. Each dependency
          degrades on its own and the response is 200 either way.
      responses:
        '200':
          description: Aggregate health; one or more dependencies may be degraded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AggregateHealth'}
  /api/v1/status:
    get:
      operationId: localAgentStatus
      description: |
        Current observable Agent state, including the BitBrowser profile scan.
        That scan is one `POST /browser/list` against the BitBrowser app, so a
        caller that polls only to show a health verdict may ask to reuse a
        recent one instead of paying for a fresh one every time.

        `scan=reuse` serves the last *successful* scan if it is under five
        minutes old (otherwise it scans anyway), and is only for background
        polling. The live scan is the default because `main_user_id` is what
        Cloud's execution gate and the account-bind flow act on: a reused one
        can describe a machine that has since changed account, and a stale id
        there is a wrong answer rather than a late one.
      parameters:
        - name: scan
          in: query
          required: false
          schema:
            type: string
            enum: [live, reuse]
            default: live
          description: |
            `live` (default, and what an absent parameter means) scans
            BitBrowser now. `reuse` accepts a scan up to five minutes old and
            may still scan when none is cached.
      responses:
        '200':
          description: Current observable Agent state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AgentStatus'}
  /api/v1/events:
    get:
      operationId: localAgentEvents
      responses:
        '200':
          description: Server-sent status events.
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/agent-token:
    post:
      operationId: setAgentToken
      description: |
        The Desktop hands over the Agent Token it exchanged from its Cloud
        Desktop session. Write-only: the answer says whether the Agent holds a
        token and when it expires, never the token itself. Replacing it does not
        interrupt a running task.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentTokenRequest'}
      responses:
        '200':
          description: Stored; the facts are read back from the stored token.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AgentTokenFacts'}
        '400': {description: 'The token string is missing (`agent_token_required`).'}
        '503': {description: 'This build has no token store (`agent_token_unavailable`).'}
  /api/v1/bit-browser/profile-scans:
    post:
      operationId: scanBitBrowserProfiles
      description: |
        A fresh real read of BitBrowser. `observed_at` is when that read happened;
        Cloud refuses facts older than its freshness window.
      responses:
        '200':
          description: Full secret-free Profile snapshot with one verified normalized BitBrowser main account.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileSnapshot'}
        '409': {description: Profile main account is empty, missing, or mixed, or Profile userId is missing.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/bit-browser/profile-groups:
    post:
      operationId: listBitBrowserProfileGroups
      description: Synchronously reads safe BitBrowser group identifiers for profile creation.
      responses:
        '200':
          description: Safe group list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [groups]
                    properties:
                      groups:
                        type: array
                        items: {$ref: '#/components/schemas/BitProfileGroup'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/bit-browser/profile-create:
    post:
      operationId: createBitBrowserProfile
      description: |
        Creates one Profile in BitBrowser from the caller's body and answers its id.
        The body is the BitBrowser creation payload (`name`, `groupId`, proxy
        fields, ...) except credentials, which are never echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileCreateRequest'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: {type: string, description: The new BitBrowser profile id.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/bit-browser/profile-open:
    post:
      operationId: openBitBrowserProfile
      responses:
        '200':
          description: The Profile was opened.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [opened]}
        '400': {description: '`id` is missing (`profile_id_required`).'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileIdRequest'}
  /api/v1/bit-browser/profile-close:
    post:
      operationId: closeBitBrowserProfile
      responses:
        '200':
          description: The Profile was closed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [closed]}
        '400': {description: '`id` is missing (`profile_id_required`).'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileIdRequest'}
  /api/v1/bit-browser/profile-update:
    post:
      operationId: updateBitBrowserProfile
      description: Updates one Profile from the caller's body (`id` plus the fields to change).
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [updated]}
        '400': {description: '`id` is missing (`profile_id_required`).'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
  /api/v1/bit-browser/profile-delete:
    post:
      operationId: deleteBitBrowserProfile
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: {type: string, enum: [deleted]}
        '400': {description: '`id` is missing (`profile_id_required`).'}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileIdRequest'}
  /api/v1/bit-account/bind:
    post:
      operationId: bindBitAccount
      description: |
        First bind or rebind of the BitBrowser main account. The main account is
        read from the running BitBrowser by the Agent and sent to Cloud as
        observed facts; the caller's body only says whether a change is
        confirmed (`rebind: true`). There is deliberately no way to type a
        `main_user_id` into this API.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BitAccountBindRequest'}
      responses:
        '200':
          description: Cloud accepted the binding; the masked view is passed through.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/BitAccountView'}
        '400': {description: 'No Agent Token has been provided (`agent_token_required`).'}
        '401': {description: Cloud refused the Agent Token.}
        '409': {description: 'Cloud refused the binding (BIT_MAIN_USER_MISMATCH, BIT_BROWSER_OFFLINE, ...).'}
        '502': {description: Cloud unreachable, or BitBrowser is not running.}
        '503': {description: No Cloud client, no token store, or the BitBrowser identity could not be read.}
  /api/v1/account-check:
    post:
      operationId: checkPlatformAccountInProfile
      description: Synchronously opens/reads one BitBrowser profile and returns only safe platform identity facts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountCheckRequest'}
      responses:
        '200':
          description: Account check finished with a business login status. Normal requires a platform_account_id.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AccountCheckResult'}
        '400': {description: Required profile or platform input is invalid.}
        '409': {description: BitBrowser identity is not verifiable.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/cookie-read:
    post:
      operationId: readProfileCookies
      description: |
        Reads the cookies of one BitBrowser Profile. The cookie list is sensitive:
        the Agent returns it to the local caller, and it must never be logged or
        sent to Cloud as an ordinary task payload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CookieReadRequest'}
      responses:
        '200':
          description: The cookies read from the Profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [cookies]
                    properties:
                      cookies:
                        type: array
                        items: {type: object}
        '400': {description: '`profile_id` is missing (`cookie_read_input_invalid`).'}
        '409': {description: BitBrowser identity is not verifiable.}
        '502': {description: BitBrowser Local API failed or returned an invalid response.}
  /api/v1/proxy-extract:
    post:
      operationId: extractDynamicProxy
      description: Synchronously fetches a user-supplied HTTPS or HTTP provider URL, parses the first valid plain-text proxy address, and returns it only to the trusted Cloud caller. It never changes a BitBrowser Profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyExtractionRequest'}
      responses:
        '200':
          description: First valid parsed proxy address.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyExtractionResult'}
        '400': {description: Extraction URL or returned address is invalid.}
        '502': {description: The provider request failed or timed out.}
  /api/v1/proxy-mutation:
    post:
      operationId: mutateProfileProxy
      description: Synchronously assigns or removes one Profile proxy in BitBrowser and returns only secret-free read-back facts after verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyMutationRequest'}
      responses:
        '200':
          description: BitBrowser accepted the mutation and read-back verifies the requested proxy state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyMutationResult'}
        '400': {description: Proxy mutation input is invalid.}
        '409': {description: The requested proxy does not match the Profile read-back.}
        '502': {description: BitBrowser Local API failed.}
  /api/v1/proxy-assignment:
    post:
      operationId: applyProfileProxy
      description: |
        Assigns one Profile proxy. A 200 means BitBrowser explicitly accepted the
        update; it does not assert read-back or proxy connectivity. Credentials
        are write-only. The Agent may read existing fingerprint before mutation
        to preserve browser identity, but does not scan after a successful write.
        A transport failure or invalid response after sending the write is an
        uncertain result and must not trigger an automatic retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxyAssignmentMutationRequest'}
      responses:
        '200':
          description: BitBrowser explicitly accepted the update.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ProxyAssignmentAccepted'}
        '400': {description: Invalid input; no update was sent.}
        '409': {description: BitBrowser explicitly rejected the update.}
        '503': {description: Outcome is uncertain; read actual state before any retry.}
  /api/v1/save-directory:
    get:
      operationId: readSaveDirectory
      description: |
        Reports where downloads are saved on this machine: the operator's stored
        choice, whether it is writable now, and the free bytes on its volume.

        `save_dir` is `null` when no choice has been stored, and the download
        executor refuses to save anything in that state rather than guessing a
        directory. Desktop pushes the choice on every start, so `null` here means
        a fresh Agent or one whose Desktop has not started yet -- never a directory
        the operator did not pick.

        `writable` and `free_bytes` are read at request time and are not part of the
        stored choice: a directory can be removed, unmounted or filled up long after
        it was chosen, and the answer worth having is the state now.
      responses:
        '200':
          description: The stored choice and its current facts; `save_dir` is null when nothing has been chosen.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SaveDirectoryFacts'}
    post:
      operationId: setSaveDirectory
      description: |
        Stores where downloads are saved on this machine, and answers with the same
        facts `GET` reports, read back from the stored value rather than from the
        request.

        The directory must be absolute and must already exist as a directory. It is
        deliberately not required to be writable: an unwritable directory is a state
        the operator has to be told about, and refusing the choice would leave them
        nowhere to see which of the two is wrong. `writable: false` in the answer
        says so, and the download executor refuses to save into it.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveDirectoryRequest'}
      responses:
        '200':
          description: The directory was stored, with its facts read back.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SaveDirectoryFacts'}
        '400': {description: The path is not absolute, or is not a directory on this machine.}
components:
  schemas:
    Health:
      type: object
      required: [status, service, mode]
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, enum: [wt-media-agent]}
        mode: {type: string, enum: [m1]}
    AgentStatus:
      type: object
      required: [agent_id, status, pending_result_count]
      properties:
        agent_id: {type: string}
        status: {type: string, enum: [idle, running, draining, offline]}
        current_task_id: {type: string, nullable: true}
        current_task_progress: {type: integer, nullable: true}
        current_task_status: {type: string, nullable: true}
        pending_result_count: {type: integer, minimum: 0}
        bitbrowser_status: {type: string, enum: [running, stopped, unreachable]}
        main_user_id:
          type: string
          description: Read from the running BitBrowser; present only when a scan succeeded.
        bit_profile_ids:
          type: array
          items: {type: string}
    DependencyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [normal, unreachable, abnormal, unknown]
          description: |
            `normal` the dependency answered for itself; `unreachable`
            BitBrowser's local API could not be reached (the same value
            `/api/v1/status` reports as `bitbrowser_status`); `abnormal` the
            dependency is configured and not answering; `unknown` this probe
            could not tell -- no endpoint configured, or a failure nobody
            anticipated, which is logged with its traceback rather than
            reported as an outage.
      additionalProperties: false
    AggregateHealth:
      type: object
      required: [status, service, agent_version, agent_status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, abnormal]
          description: |
            `ok` only when all three dependencies report `normal`. `unknown`
            counts as degraded: "nobody can tell" is not "fine", and this is
            the field a monitor reads.
        service: {type: string, enum: [wt-media-agent]}
        agent_version: {type: string, description: The Agent version, normalized to its numeric form; `/api/v1/status` reports the same string.}
        agent_status: {type: string, description: The Agent's own status; the roll-up is the top-level status.}
        dependencies:
          type: object
          required: [cloud, bitbrowser, storage]
          properties:
            cloud: {$ref: '#/components/schemas/DependencyStatus'}
            bitbrowser: {$ref: '#/components/schemas/DependencyStatus'}
            storage: {$ref: '#/components/schemas/DependencyStatus'}
          additionalProperties: false
      additionalProperties: false
    ProfileSnapshot:
      type: object
      required: [main_user_id, profiles, observed_at]
      properties:
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId.}
        observed_at:
          type: string
          format: date-time
          description: When this read happened; Cloud rejects a fact older than its freshness window.
        profiles:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/BitProfile'}
    BitProfile:
      type: object
      required: [bit_profile_id, main_user_id, profile_user_id, name, group_id, group_name, bit_updated_at]
      properties:
        bit_profile_id: {type: string}
        main_user_id: {type: string, description: Normalized from BitBrowser mainUserId; must match snapshot main_user_id.}
        profile_user_id: {type: string, description: Normalized from BitBrowser userId for Profile/sub-account audit.}
        name: {type: string}
        seq: {type: integer, nullable: true}
        group_id: {type: string}
        group_name: {type: string}
        status: {oneOf: [{type: integer}, {type: string}], nullable: true}
        bit_updated_at: {type: string}
      additionalProperties: false
    BitProfileGroup:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
      additionalProperties: false
    ProfileCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        groupId: {type: string, description: BitBrowser group id; `group_id` is accepted as an alias.}
      additionalProperties: true
    ProfileIdRequest:
      type: object
      required: [id]
      properties:
        id: {type: string, description: BitBrowser profile id.}
      additionalProperties: false
    ProfileUpdateRequest:
      type: object
      required: [id]
      properties:
        id: {type: string, description: BitBrowser profile id.}
      additionalProperties: true
    AgentTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
          description: Secret. Held in memory by the Agent; never persisted, logged, or echoed.
        expires_at: {type: integer, format: int64, description: Unix seconds; omitted or non-integer is stored as unknown.}
      additionalProperties: false
    AgentTokenFacts:
      type: object
      required: [has_agent_token]
      properties:
        has_agent_token: {type: boolean}
        expires_at: {type: integer, format: int64, nullable: true}
      additionalProperties: false
    BitAccountBindRequest:
      type: object
      properties:
        rebind:
          type: boolean
          default: false
          description: >
            The user's explicit confirmation to change the bound main account. Without
            it, a different observed main account is refused and nothing is migrated.
      additionalProperties: false
    BitAccountView:
      type: object
      required: [bound]
      properties:
        bound: {type: boolean}
        main_user_id_masked: {type: string, description: Full main_user_id never leaves Cloud.}
        bound_at: {type: string, format: date-time}
        last_verified_at: {type: string, format: date-time}
      additionalProperties: false
    AccountCheckRequest:
      type: object
      required: [profile_id, platform]
      properties:
        profile_id: {type: string, description: BitBrowser profile id.}
        platform: {type: string, enum: [bilibili, baidu, douyin]}
        expected_platform_account_id: {type: string, description: Existing Cloud platform account id used to detect mismatch.}
      additionalProperties: false
    AccountCheckResult:
      type: object
      required: [platform_account_id, name, avatar_url, login_status, message]
      properties:
        platform_account_id: {type: string}
        name: {type: string}
        avatar_url: {type: string}
        login_status:
          type: string
          enum: [normal, not_logged_in, verification_needed, expired, restricted, account_mismatch, environment_error]
        message: {type: string}
        check_items:
          type: array
          items: {type: object}
          description: Per-item evidence for the verdict.
      additionalProperties: false
    CookieReadRequest:
      type: object
      required: [profile_id]
      properties:
        profile_id: {type: string, description: BitBrowser profile id.}
      additionalProperties: false
    ProxyExtractionRequest:
      type: object
      required: [extract_url]
      properties:
        extract_url: {type: string, format: uri, writeOnly: true}
        proxy_protocol: {type: string, enum: [http, https, socks5], default: http}
      additionalProperties: false
    ProxyExtractionResult:
      type: object
      required: [proxy_protocol, host, port]
      properties:
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string}
        password: {type: string, description: Sensitive draft field; never log or include in BitBrowser read-back.}
      additionalProperties: false
    ProxyMutationRequest:
      oneOf:
        - {$ref: '#/components/schemas/ProxyAssignmentMutationRequest'}
        - {$ref: '#/components/schemas/ProxyUnbindMutationRequest'}
    ProxyAssignmentMutationRequest:
      type: object
      required: [profile_id, proxy_protocol, host, port]
      properties:
        operation: {type: string, enum: [assign], default: assign}
        profile_id: {type: string, description: BitBrowser profile id.}
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, writeOnly: true}
        password: {type: string, writeOnly: true}
      additionalProperties: false
    ProxyUnbindMutationRequest:
      type: object
      required: [operation, profile_id]
      properties:
        operation: {type: string, enum: [unbind]}
        profile_id: {type: string, description: BitBrowser profile id.}
      additionalProperties: false
    ProxyMutationResult:
      oneOf:
        - {$ref: '#/components/schemas/ProxyAssignmentMutationResult'}
        - {$ref: '#/components/schemas/ProxyUnbindMutationResult'}
    ProxyAssignmentMutationResult:
      type: object
      required: [profile_id, proxy_protocol, host, port, readback]
      properties:
        profile_id: {type: string}
        proxy_protocol: {type: string, enum: [http, https, socks5]}
        host: {type: string}
        port: {type: integer}
