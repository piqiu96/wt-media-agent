# WT Media Agent -- runtime configuration.
#
# Precedence, per key: environment variable > this file > built-in default.
#
# This directory is the only configuration the runtime reads. `config_online/`
# is the release replacement source: shipping replaces `config/` wholesale with
# `config_online/`, and no runtime code reads `config_online/` or switches on it
# (ADR-0016). A missing file is not an error -- every key falls back to its
# built-in default, which is how a bundled sidecar starts before Desktop passes
# anything in.
#
# Credentials do not belong here. Keys such as `runtime_token` are read from the
# environment only; a sensitive key found in this file is ignored and reported
# by name. The environment does not travel in the release artifact, this file
# does.

environment = "development"

[cloud]
base_url = "http://127.0.0.1:8188"
timeout_seconds = 10.0

[local_api]
# A packaged sidecar is loopback-only: Desktop overrides host and port through
# the environment, and a customer environment must never widen the binding.
host = "127.0.0.1"
port = 8765

[bitbrowser]
api_url = "http://127.0.0.1:54345"
timeout_seconds = 5.0

# `bitbrowser.create_timeout_seconds` and `bitbrowser.mutation_timeout_seconds`
# are intentionally absent. Leaving them out means the BitBrowser client's own
# DEFAULT_*_TIMEOUT applies; setting them can only raise a timeout, never lower
# it below `timeout_seconds` above. Keeping them absent keeps that default in
# one place instead of duplicating 30.0 here.

[agent]
# The Agent identity Cloud sees. One Agent per installed Desktop, so the
# default matches the Local Agent's historical value; Desktop overrides it per
# launch through WT_MEDIA_AGENT_ID when it needs to distinguish instances.
id = "local-agent-dev"
# Whether this process polls Cloud for tasks. Off by default on purpose: an
# Agent started by hand or by a health check must not begin claiming tasks just
# because it was started. The acceptance scripts and Desktop turn it on.
run_runner = false
# Empty means "decide from the deployment shape": a source checkout writes to
# <repo>/.local/data, an installed agent to
# ~/Library/Application Support/WTMedia/Agent. Set this only to pin a location,
# which is what Desktop does when it spawns a sidecar.
data_dir = ""

[logging]
level = "INFO"
# Empty means "use <logs_dir>/agent.log" -- the resolved logs directory, which
# is <repo>/.local/logs in a source checkout and
# ~/Library/Logs/WTMedia/Agent when installed. Records reach the terminal as
# well: the stderr handler is always installed, so setting this adds a file
# rather than replacing the live view. (Before CHG-057 T-03 a source checkout
# wrote no file at all, so this key was the only way to get one.)
file = ""
# Retention (CHG-058 T-02). Each file rolls hourly -- the live file stays
# `agent.log`, each hour that ends becomes `agent.log.<YYYY-MM-DD-HH>` -- and a
# record too long for one line is truncated with
# `truncate=true original_size=<n>` rather than allowed to grow the file.
# Rolled files survive retention_days. There is no cap on a file's size or on
# the three files together: how long history stays is bounded, how much of it
# there is is not. Uncomment to override the built-in 1 MiB / 14 days.
# max_record_bytes = 1048576
# retention_days = 14
