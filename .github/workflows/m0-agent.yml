name: M0 Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Bootstrap Agent
        run: scripts/bootstrap.sh

      - name: Test Agent
        run: scripts/test.sh

      - name: Apply SQLite storage migrations
        run: |
          scripts/migrate-storage.sh --data-dir /tmp/wt-media-agent-m0-ci
          scripts/migrate-storage.sh --data-dir /tmp/wt-media-agent-m0-ci

      - name: Build Agent package
        run: scripts/build.sh
