<!doctype html><meta charset="utf-8"><title>Isolated controls — not platform acceptance</title>
<style>body{margin:30px;font:16px sans-serif}button,input{margin:12px;padding:10px}[role=dialog]{position:fixed;inset:10%;background:white;border:2px solid gray;padding:30px;z-index:10}[contenteditable]{border:1px solid #ccc;min-height:70px}img{width:80px;height:60px}input[type=file]{display:none}.covers{display:flex;gap:20px;margin:20px}</style>
<div id="cover-tabs-container"><input type="file" accept=".mp4"></div><div id="mount"></div>
<script>
window.finalClicks=0;
window.fixtureEditor=()=>{
 document.querySelector('#mount').innerHTML=`<button style="opacity:0;pointer-events:none">我知道了</button><div contenteditable="true" role="textbox">${window.fixtureMatchingDraft ? "确认描述 #测试话题" : "default filename"}</div><video src="data:video/mp4;base64,${window.selectedVideoSize && !window.fixtureKeepOldVideo ? "bmV3" : "b2xk"}"></video><input placeholder="请选择创作声明" readonly><div class="covers"><div data-testid="cover-preview"><img></div><div data-testid="cover-preview"><img></div></div><button id="final">发布</button><button>存草稿</button><div id="dialogs"></div>`;
 document.querySelector('#final').onclick=()=>{window.finalClicks++;const publish=()=>fetch('/pcui/article/publish?type=video',{method:'POST',body:new URLSearchParams({title:document.querySelector('[contenteditable]').innerText})});if(window.fixtureConfirmTopics){let d=dialog();d.innerHTML='<div>作品描述中存在未匹配的话题/@内容</div><button>不处理</button><button>自动匹配</button>';if(window.fixtureChangeTopicsText)document.querySelector('[contenteditable]').innerText='unexpected edit';d.querySelector('button').onclick=()=>{d.remove();publish()}}else publish()};
 const blank='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60"><rect width="80" height="60" fill="gray"/></svg>');document.querySelectorAll('.covers img').forEach(e=>e.src=blank);
 function dialog(){const d=document.createElement('div');d.setAttribute('role','dialog');document.querySelector('#dialogs').append(d);return d}
 document.querySelector('input[placeholder]').onclick=()=>{let d=dialog();d.innerHTML='<div><label><input type="radio"></label><span>无需声明</span></div><button>确定</button>';d.querySelector('span').onclick=()=>d.querySelector('input').checked=true;d.querySelector('button').onclick=()=>{if(d.querySelector('input').checked)document.querySelector('input[placeholder]').value='无需声明';d.style.display='none'}};
 document.querySelectorAll('[data-testid=cover-preview]').forEach((cover,i)=>cover.onclick=()=>{let d=dialog();d.innerHTML='<p>封面截取</p><span class="cheetah-upload"><input type="file" accept="image/*"></span><span>本地上传</span><button>确定</button>';let image;d.querySelector('input').onchange=e=>{image=document.createElement('img');image.src=URL.createObjectURL(e.target.files[0]);d.querySelector('.cheetah-upload').append(image)};d.querySelector('button').onclick=()=>{if(image && image.complete && image.naturalWidth>0){const preview=image.cloneNode();const replace=()=>{cover.textContent='';cover.setAttribute('data-testid','cover-preview');cover.append(preview);window.fixturePreviewWaiting=false;if(!window.fixtureTemporaryCoversOnly)setTimeout(()=>preview.src='https://baijiahao.baidu.com/fixture-cover/'+i,150)};if(window.fixtureNeverPreview && i===0){}else if(window.fixtureStalePreview && i===0){window.fixturePreviewWaiting=true;setTimeout(replace,1500)}else if(window.fixtureDelayedPortrait && i===1){cover.textContent='';window.fixturePreviewWaiting=true;setTimeout(replace,500)}else replace()}d.style.display='none'}});
 if(window.fixtureBlankCovers)document.querySelectorAll('[data-testid=cover-preview]').forEach(cover=>{cover.setAttribute('data-testid','select-cover');cover.textContent='选择封面'});
};
if(window.fixtureRestoreEditor){
 const root=document.querySelector('#cover-tabs-container'),input=root.querySelector('input');
 const current=document.createElement('div');current.className='observed-activeItem';current.innerHTML='<div class="inputWrap"></div>';current.firstChild.append(input);
 const add=document.createElement('div');add.className='cover-add';add.innerHTML='<div class="inputWrap"><input type="file" accept=".mp4"></div>';
 add.querySelector('input').onchange=e=>window.addedVideoSize=e.target.files[0].size;
 root.replaceChildren(current,add);
}
document.querySelector('input[accept=".mp4"]').onchange=e=>{window.selectedVideoSize=e.target.files[0].size;window.fixtureEditor();if(window.fixtureUploadStalled)document.querySelector('#cover-tabs-container').insertAdjacentHTML('beforeend','<p>上传中 25%</p>')};
if(window.fixtureRestoreEditor)window.fixtureEditor();
</script>
